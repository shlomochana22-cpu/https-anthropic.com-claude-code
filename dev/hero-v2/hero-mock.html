<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Heebo,sans-serif;background:#fff;color:#1d1d1f}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #eee}
.logo{font-weight:800;font-size:22px;color:#253470}.logo b{color:#F8A91F}
.menu{width:26px;height:18px;border-top:3px solid #253470;border-bottom:3px solid #253470;position:relative}.menu:after{content:"";position:absolute;left:0;right:0;top:5px;border-top:3px solid #253470}
.mb-hero{max-width:1200px;margin:0 auto;padding:0 0 24px}
.mb-hero picture img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.mb-hero .txt{padding:20px 16px 0}
.mb-hero h1{margin:0 0 10px;font-size:28px;line-height:1.2;color:#253470;font-weight:800}
.mb-hero p.sub{margin:0 0 16px;font-size:17px;line-height:1.55;color:#3a3a3c}
.mb-hero .btns{display:flex;flex-direction:column;gap:8px}
.mb-hero .btns a{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:12px;font-size:18px;font-weight:700;text-decoration:none;transition:transform .1s ease-out}
.mb-hero .btns a:active{transform:scale(.97)}
.mb-hero .call{background:#F8A91F;color:#253470}.mb-hero .wa{background:#168f47;color:#fff}
.mb-hero .trust{margin:14px 0 0;font-size:15px;color:#3a3a3c}.mb-hero .trust b{color:#253470}.star{color:#F8A91F}
@media (min-width:900px){
 .mb-hero{display:grid;grid-template-columns:1fr 1.25fr;gap:48px;align-items:center;padding:40px 32px}
 .mb-hero .txt{padding:0}
 .mb-hero picture img{aspect-ratio:auto;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
 .mb-hero picture{order:2}
 .mb-hero h1{font-size:44px;line-height:1.1;letter-spacing:-0.01em}
 .mb-hero p.sub{font-size:19px}
 .mb-hero .btns{flex-direction:row}.mb-hero .btns a{padding:0 26px}
}
@media (prefers-reduced-motion:reduce){.mb-hero .btns a{transition:none}.mb-hero .btns a:active{transform:none}}
</style></head><body>
<div class="hdr"><div class="logo">מצבר <b>הדרך</b></div><div class="menu"></div></div>
<section class="mb-hero">
<picture><source media="(max-width:899px)" srcset="hero-mobile-800.webp"><img src="hero-desktop-1600.webp" srcset="hero-desktop-1200.webp 1200w, hero-desktop-1600.webp 1600w" sizes="(min-width:900px) 640px, 100vw" width="1600" height="932" alt="טכנאי מצבר הדרך מחליף מצבר לרכב ליד ניידת השירות" fetchpriority="high"></picture>
<div class="txt">
<h1>מצבר הדרך - החלפת מצבר עד הבית</h1>
<p class="sub">טכנאי מגיע עד הרכב, מחליף מצבר במקום ובודק את מערכת הטעינה ללא עלות. 24 שעות ביממה, כולל שבת. מצבר מ-379 ש"ח כולל התקנה.</p>
<div class="btns"><a class="call" href="#">חייגו עכשיו 055-5033335</a><a class="wa" href="#">הודעה בוואטסאפ</a></div>
<p class="trust"><span class="star">★★★★★</span> <b>4.9</b> מתוך 114 ביקורות בגוגל</p>
</div></section>
<div style="padding:0 16px;max-width:1200px;margin:0 auto"><h2 style="color:#253470">איך זה עובד?</h2><p>המשך דף הבית הקיים...</p></div>
</body></html>
