<!-- NEXUS — Screen Hub / Index -->
<!DOCTYPE html>
<html class="dark" dir="rtl" lang="he"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NEXUS | מרכז מסכים</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: { extend: { colors: {
      "background": "#0a0a0a", "surface": "#131313", "primary-fixed": "#bff520",
      "secondary-fixed": "#7df4ff", "on-surface": "#e5e2e1", "on-surface-variant": "#c3c9ad",
      "surface-container": "#201f1f", "surface-container-high": "#2a2a2a"
    }, fontFamily: { sans: ["Varela Round", "sans-serif"] } } }
  }
</script>
<style>
  body { font-family: 'Varela Round', sans-serif; background-color: #0a0a0a; color: #e5e2e1; }
  .glass { background: rgba(26,26,26,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); }
  .neon { filter: drop-shadow(0 0 12px rgba(191,245,32,0.4)); }
  .card-hover { transition: all .25s ease; }
  .card-hover:hover { transform: translateY(-4px); border-color: rgba(191,245,32,0.4); box-shadow: 0 0 24px rgba(191,245,32,0.12); }
</style>
</head>
<body class="bg-background min-h-screen">
<!-- Header -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/10 flex justify-between items-center px-5 md:px-16 h-16">
  <div class="flex items-center gap-3">
    <span class="material-symbols-outlined text-primary-fixed neon">bolt</span>
    <span class="text-2xl font-extrabold tracking-tighter text-primary-fixed neon">NEXUS</span>
    <span class="bg-primary-fixed text-[#151f00] px-2 py-0.5 rounded text-[10px] font-bold tracking-widest">HUB</span>
  </div>
  <span class="text-on-surface-variant text-sm hidden sm:block">מרכז ניווט · 34 מסכים</span>
</header>

<main class="pt-24 pb-20 px-5 md:px-16 max-w-7xl mx-auto">
  <!-- Hero -->
  <section class="mb-12 text-center">
    <h1 class="text-4xl md:text-5xl font-extrabold text-primary-fixed neon mb-3">NEXUS · פורטל חיי הלילה</h1>
    <p class="text-on-surface-variant text-lg max-w-2xl mx-auto">אוסף המסכים המלא — צד משתמש, צד מפיק (Pro), ואדמין. לחצו על כל כרטיס כדי לפתוח את המסך.</p>
  </section>

  <!-- USER SIDE -->
  <section class="mb-12">
    <div class="flex items-center gap-3 mb-6">
      <span class="material-symbols-outlined text-primary-fixed">person</span>
      <h2 class="text-2xl font-bold text-white">צד משתמש</h2>
      <div class="flex-1 h-px bg-white/10"></div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="user-grid"></div>
  </section>

  <!-- PRODUCER SIDE -->
  <section class="mb-12">
    <div class="flex items-center gap-3 mb-6">
      <span class="material-symbols-outlined text-secondary-fixed">dashboard</span>
      <h2 class="text-2xl font-bold text-white">צד מפיק (Pro)</h2>
      <div class="flex-1 h-px bg-white/10"></div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="producer-grid"></div>
  </section>

  <!-- ADMIN SIDE -->
  <section class="mb-12">
    <div class="flex items-center gap-3 mb-6">
      <span class="material-symbols-outlined text-primary-fixed">shield_person</span>
      <h2 class="text-2xl font-bold text-white">אדמין</h2>
      <div class="flex-1 h-px bg-white/10"></div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="admin-grid"></div>
  </section>
</main>

<script>
  const screens = {
    user: [
      ["home.html", "דף בית", "explore"],
      ["discover.html", "חיפוש וגילוי", "search"],
      ["discover-location.html", "גילוי לפי מיקום", "near_me"],
      ["marketplace.html", "מרקטפלייס", "storefront"],
      ["event.html", "עמוד אירוע", "celebration"],
      ["live-story.html", "Live Story", "sensors"],
      ["map.html", "מפת אירוע", "map"],
      ["order-summary.html", "סיכום הזמנה", "receipt_long"],
      ["payment.html", "תשלום", "credit_card"],
      ["purchase-confirmation.html", "אישור רכישה", "task_alt"],
      ["my-tickets.html", "הכרטיסים שלי", "confirmation_number"],
      ["favorites.html", "מועדפים", "favorite"],
      ["resale.html", "מכירה חוזרת", "sell"],
      ["rating.html", "דירוג ומשוב", "star"],
      ["wallet.html", "ארנק", "account_balance_wallet"],
      ["notifications.html", "התראות", "notifications"],
      ["help.html", "מרכז עזרה", "support_agent"],
      ["profile.html", "פרופיל והגדרות", "manage_accounts"],
    ],
    producer: [
      ["login.html", "כניסת מפיק", "login"],
      ["producer-dashboard.html", "דשבורד מפיק", "dashboard"],
      ["promoter-dashboard.html", "דשבורד יחצן", "campaign"],
      ["create-general.html", "יצירת אירוע · שלב 1", "edit_note"],
      ["create-tickets.html", "יצירת אירוע · שלב 2", "confirmation_number"],
      ["create-media.html", "יצירת אירוע · שלב 3", "image"],
      ["stats-detailed.html", "סטטיסטיקה מפורטת", "analytics"],
      ["stats-cyber-rave.html", "אנליטיקות Live", "monitoring"],
      ["leaderboard.html", "לידרבורד יחצנים", "leaderboard"],
      ["scanner.html", "סורק כרטיסים", "qr_code_scanner"],
      ["guest-list.html", "רשימות מוזמנים", "group"],
      ["coupons.html", "קופונים והנחות", "local_offer"],
      ["campaigns.html", "סטודיו קמפיינים", "ads_click"],
      ["customers.html", "מאגר לקוחות", "contacts"],
    ],
    admin: [
      ["admin-data.html", "ניהול דאטא גלובלי", "database"],
    ]
  };

  function card([file, title, icon]) {
    return `<a href="screens/${file}" class="glass card-hover rounded-xl p-5 flex flex-col gap-3 group">
      <div class="w-12 h-12 rounded-lg bg-primary-fixed/10 flex items-center justify-center">
        <span class="material-symbols-outlined text-primary-fixed group-hover:scale-110 transition-transform">${icon}</span>
      </div>
      <div>
        <p class="font-bold text-white text-sm">${title}</p>
        <p class="text-[11px] text-on-surface-variant/50 font-mono mt-1" dir="ltr">${file}</p>
      </div>
    </a>`;
  }

  document.getElementById('user-grid').innerHTML = screens.user.map(card).join('');
  document.getElementById('producer-grid').innerHTML = screens.producer.map(card).join('');
  document.getElementById('admin-grid').innerHTML = screens.admin.map(card).join('');
</script>
</body></html>
