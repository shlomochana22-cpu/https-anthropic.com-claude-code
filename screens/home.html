<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', function() { this.classList.add('scale-95'); });
            btn.addEventListener('touchend', function() { this.classList.remove('scale-95'); });
        });
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('bg-surface/90');
                header.classList.remove('bg-surface/40');
            } else {
                header.classList.add('bg-surface/40');
                header.classList.remove('bg-surface/90');
            }
        });
    </script>
