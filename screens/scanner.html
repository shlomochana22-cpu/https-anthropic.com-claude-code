<script>
    function simulateScan(success) {
        const overlay = document.getElementById('status-overlay'); const content = document.getElementById('status-content');
        overlay.classList.remove('opacity-0', 'pointer-events-none'); overlay.classList.add('opacity-100'); content.classList.remove('scale-90'); content.classList.add('scale-100');
        content.innerHTML = `<div class="relative mx-auto w-24 h-24 mb-6"><div class="absolute inset-0 bg-primary-fixed/20 rounded-full success-pulse"></div><div class="relative flex items-center justify-center w-full h-full bg-primary-fixed rounded-full shadow-[0_0_30px_rgba(191,245,32,0.6)]"><span class="material-symbols-outlined text-black text-6xl font-bold">check</span></div></div><h2 class="text-headline-lg text-primary-fixed mb-2">כניסה אושרה</h2><p class="text-headline-md text-white font-extrabold mb-1">עידן אטיאס</p><div class="flex items-center justify-center gap-1 text-label-md text-on-surface-variant"><span class="material-symbols-outlined text-[16px] text-primary-fixed">star</span><span>VIP Experience • דלת אחורית</span></div><button onclick="closeOverlay()" class="mt-8 px-10 py-3 bg-primary-fixed text-black font-bold rounded-full hover:scale-105 active:scale-95 transition-all">סריקה הבאה</button>`;
        setTimeout(closeOverlay, 2500);
    }
    function closeOverlay() { const overlay = document.getElementById('status-overlay'); const content = document.getElementById('status-content'); overlay.classList.add('opacity-0', 'pointer-events-none'); overlay.classList.remove('opacity-100'); content.classList.add('scale-90'); content.classList.remove('scale-100'); }
</script>
